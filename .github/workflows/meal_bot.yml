name: Daily Dorm Meal Bot

on:
  schedule:
    # UTC 시각 22:30 = 한국 시각(KST) 다음 날 07:30
    - cron: '23 22 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 내 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치하기
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요 라이브러리 설치하기
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 식단 스크립트 실행하기
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py